[scripts]
setup = '''
UV_VERSION="$(uv --version 2>/dev/null | awk '{print $2}')"
if [ "$UV_VERSION" != "0.12.5" ]; then
  pipx install --force uv==0.12.5
fi

uv sync --locked

if [ ! -f .env ]; then
  SOURCE_ENV="$CONDUCTOR_ROOT_PATH/.env"

  if [ -n "$CONDUCTOR_ROOT_PATH" ] && [ -f "$SOURCE_ENV" ]; then
    cp "$SOURCE_ENV" .env
  else
    cp .env.template .env
  fi
fi
'''
