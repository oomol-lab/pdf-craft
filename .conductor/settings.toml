[scripts]
setup = '''
if ! command -v poetry >/dev/null 2>&1; then
  pipx install poetry==2.1.3
fi

PYTHON_BIN="$(command -v python3.11 || pyenv which python3 2>/dev/null || command -v python3)"
"$PYTHON_BIN" - <<'PY'
import sys
if not ((3, 11) <= sys.version_info < (3, 14)):
    raise SystemExit(f"Python >=3.11,<3.14 is required, got {sys.version.split()[0]}")
PY

VENV_PYTHON="$PWD/.venv/bin/python"
if [ -x "$VENV_PYTHON" ]; then
  if ! "$VENV_PYTHON" - <<'PY'
import sys
if not ((3, 11) <= sys.version_info < (3, 14)):
    raise SystemExit(1)
PY
  then
    rm -rf "$PWD/.venv"
  fi
fi

if [ ! -x "$VENV_PYTHON" ]; then
  "$PYTHON_BIN" -m venv "$PWD/.venv"
fi

export VIRTUAL_ENV="$PWD/.venv"
export PATH="$VIRTUAL_ENV/bin:$PATH"

poetry config virtualenvs.in-project true
poetry install --with dev

if [ ! -f .env ]; then
  SOURCE_ENV="$CONDUCTOR_ROOT_PATH/.env"

  if [ -n "$CONDUCTOR_ROOT_PATH" ] && [ -f "$SOURCE_ENV" ]; then
    cp "$SOURCE_ENV" .env
  else
    cp .env.template .env
  fi
fi
'''
