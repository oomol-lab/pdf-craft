[scripts]
setup = '''
if ! command -v uv >/dev/null 2>&1; then
  pipx install uv==0.12.5
fi

uv sync --locked

if [ ! -f .env ]; then
  SOURCE_ENV="$CONDUCTOR_ROOT_PATH/.env"

  if [ -n "$CONDUCTOR_ROOT_PATH" ] && [ -f "$SOURCE_ENV" ]; then
    cp "$SOURCE_ENV" .env
  else
    cp .env.template .env
  fi
fi
'''
