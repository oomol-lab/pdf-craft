name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.1.3"

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install PDF and Qt runtime
        timeout-minutes: 5
        run: |
          apt_options=(-o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          runner_proxy="${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}"
          if [ -n "$runner_proxy" ]; then
            echo "Using the configured runner proxy for APT."
            apt_options+=(-o "Acquire::http::Proxy=$runner_proxy" -o "Acquire::https::Proxy=$runner_proxy")
          else
            echo "No runner proxy is configured."
          fi
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes poppler-utils libpoppler-glib8 ghostscript libegl1

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Run pyright checking
        run: |
          poetry run pyright pdf_craft tests

      - name: Run linting
        run: |
          poetry run pylint pdf_craft tests

      - name: Run tests
        run: |
          poetry run python test.py
