name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Check release state
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

          VERSION="$(uv version --short --locked)"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]+)?$ ]]; then
            echo "pyproject.toml version must be a release version without the leading v, for example: 1.0.14"
            exit 1
          fi

          TAG="v${VERSION}"
          CHANGELOG_PATH="docs/changelog/${TAG}.md"

          if [[ ! -s "${CHANGELOG_PATH}" ]]; then
            echo "Missing or empty changelog: ${CHANGELOG_PATH}"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Remote tag already exists: ${TAG}"
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "changelog_path=${CHANGELOG_PATH}" >> "${GITHUB_OUTPUT}"
        id: release-inputs

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pyright checking
        run: uv run pyright pdf_craft tests

      - name: Run linting
        run: uv run pylint pdf_craft tests

      - name: Run tests
        run: uv run python test.py

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Push release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-inputs.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${GITHUB_SHA}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-inputs.outputs.tag }}
          CHANGELOG_PATH: ${{ steps.release-inputs.outputs.changelog_path }}
        run: |
          gh release create "${TAG}" dist/* \
            --title "${TAG}" \
            --notes-file "${CHANGELOG_PATH}" \
            --verify-tag
